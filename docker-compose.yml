services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lrms_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/lrms?schema=public"
      JWT_SECRET: "change-me-in-production-min-32-chars-long-secret"
      JWT_REFRESH_SECRET: "change-me-refresh-secret-min-32-chars-long"
      RAZORPAY_TEST_MODE: "true"
      CORS_ORIGIN: "http://localhost:5173"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    # After first boot, run migrations + seed once:
    #   docker compose exec api npx prisma migrate deploy
    #   docker compose exec api npm run seed

  # Frontend web service — enabled only once the frontend agent adds
  # frontend/Dockerfile. Run with: docker compose --profile with-web up
  web:
    profiles: ["with-web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"

volumes:
  lrms_pgdata:
